<main class="app-container" [class.sheet-layout]="sheetOpen()">
  <header class="app-header" [class.sheet-brand-hidden]="sheetOpen()" aria-label="Application header">
    <img
      class="app-icon"
      ngSrc="app_icon.png"
      width="48"
      height="48"
      priority
      alt="Dice Ally logo"
    />
    <div class="app-header__text">
      <span class="app-title">Dice Ally</span>
      <span class="app-subtitle">For what is NOT written in the dice</span>
    </div>
  </header>
  @if (account.accessible()) {
    <app-sync-status [compact]="sheetOpen()" (signOut)="signOut()" />
  }

  <section class="app-content">
    <div class="page-transition">
      @if (account.accessible() && !sync.initialReady()) {
        <div class="mx-auto max-w-sm p-6 text-center" role="status" aria-live="polite">
          <h1 class="text-xl font-semibold">Loading Characters</h1>
          <p class="mt-2 text-sm text-on-surface-variant">Checking your cloud saves and preparing this device…</p>
        </div>
      } @else {
        <router-outlet></router-outlet>
      }
    </div>
  </section>

<!--   <footer class="app-footer" aria-label="Legal links">
    <nav class="app-footer__links" aria-label="Impressum und Datenschutz">
      <a routerLink="/impressum">Impressum</a>
      <span aria-hidden="true">|</span>
      <a routerLink="/datenschutz">Datenschutz</a>
    </nav>
  </footer> -->
</main>

@if (dialogs.current(); as request) { <app-dialog [request]="request" /> }
