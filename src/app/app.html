<main class="app-container">
  <header class="app-header" aria-label="Application header">
    <img
      class="app-icon"
      ngSrc="app_icon.png"
      width="48"
      height="48"
      priority
      alt="AllySheetViewer logo"
    />
    <div class="app-header__text">
      <span class="app-title">AllySheetViewer</span>
      <span class="app-subtitle">Character sheet companion</span>
    </div>
  </header>
  @if (development) {
    <nav aria-label="Development workflows" class="max-w-[1100px] mx-auto p-4 flex gap-4">
      <a routerLink="/dev/characters">Local Creator / Editor</a>
      <a routerLink="/dev/content">Content imports</a>
    </nav>
  }

  <section class="app-content">
    <div class="page-transition">
      <router-outlet></router-outlet>
    </div>
  </section>

      <a routerLink="/impressum">Impressum</a>
      <span aria-hidden="true">|</span>
      <a routerLink="/datenschutz">Datenschutz</a>
    </nav>
  </footer> -->
</main>
